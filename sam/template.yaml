AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  undocs-undl-api - UN Digital Library failover endpoint for UNDOCS.
  Runs the existing Flask/Gunicorn container unchanged on Lambda via the
  AWS Lambda Web Adapter, fronted by an HTTP API.

Parameters:
  FunctionArchitecture:
    Type: String
    Default: arm64
    AllowedValues:
      - arm64
      - x86_64
    Description: Lambda function architecture
    
  FlaskEnv:
    Type: String
    Default: production
    AllowedValues:
      - production
      - development
    Description: Selects which SSM parameter/Mongo database the app connects to.

  ProvisionedConcurrentExecutions:
    Type: Number
    Default: 0
    Description: >
      Warm Lambda instances kept ready at all times. Left at 0 by default
      since cold-start latency is acceptable for this deployment; raise
      this later if a stricter latency target is set.

  ReservedConcurrentExecutions:
    Type: Number
    Default: 100
    Description: >
      Maximum number of simultaneous executions. Because Function URLs have
      no built-in request throttling (unlike the previous HTTP API), this
      caps concurrency to protect against runaway cost and abuse. At the
      expected ~0.75 req/sec baseline this ceiling is generous; raise it if
      legitimate concurrent streaming demand grows.

  ProjectTag:
    Type: String
    Default: undocs-undl-api
    Description: >
      Value for the 'Project' cost-allocation tag applied to all resources
      in this stack. Activate the 'Project' tag under Billing > Cost
      allocation tags to break costs down by project in Cost Explorer.

Globals:
  Function:
    # 120s accommodates streaming the largest documents (>100 MB) to slower
    # clients. Function URLs support up to 15 minutes if ever needed.
    Timeout: 120
    MemorySize: 512
    # Applied to the Lambda function (and, for Serverless::Function, its
    # generated resources). Stack-level tagging (see Deploy note in README)
    # covers the CloudFormation-managed resources more broadly.
    Tags:
      Project: !Ref ProjectTag
      Environment: !Ref FlaskEnv

Resources:
  UndlApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Architectures:
        - !Ref FunctionArchitecture
      PackageType: Image
      Environment:
        Variables:
          FLASK_ENV: !Ref FlaskEnv
          PORT: "8000"
          AWS_LWA_READINESS_CHECK_PATH: /health
          # Enable response streaming in the Lambda Web Adapter so large
          # files are streamed to the client rather than buffered (which
          # would hit the 6 MB synchronous response payload limit).
          AWS_LWA_INVOKE_MODE: response_stream
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/prodISSU-admin-connect-string
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/devISSU-admin-connect-string
      # A Lambda Function URL is used instead of an HTTP API because response
      # streaming (up to 20 MB soft limit, raisable to 6 GB) is only supported
      # via Function URLs, not API Gateway.
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
      # Function URLs have no built-in throttling, so concurrency is capped
      # here as the equivalent safeguard.
      ReservedConcurrentExecutions: !Ref ReservedConcurrentExecutions
      AutoPublishAlias: live
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ..
      DockerTag: latest

Outputs:
  FunctionUrl:
    Description: Base URL for the failover API (this is the <base_url> in the ToR's endpoint pattern)
    Value: !GetAtt UndlApiFunctionUrl.FunctionUrl
  FunctionArn:
    Description: ARN of the underlying Lambda function
    Value: !GetAtt UndlApiFunction.Arn