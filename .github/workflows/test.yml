name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/test_health.py tests/test_routes.py tests/test_middleware.py -v
